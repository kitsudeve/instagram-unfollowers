us.forEach(u=>{const m=p.meta[u]=p.meta[u]||{};delete m.k;delete m.x;m.s=v||'';m.t=now});sv(p.name);
if(p.demo&&!setStatus.warned){setStatus.warned=1;say('This is the example profile, so changes to it aren’t saved')}}

/* ---------- events ---------- */
let shiftOn=false,lastI=null;
document.addEventListener('click',e=>{
if(e.target&&e.target.matches&&e.target.matches('input[data-sel]'))shiftOn=e.shiftKey;
const b=e.target.closest?e.target.closest('button[data-a],a[data-a]'):null;
if(!b){const t2=e.target;
if(t2.closest&&t2.closest('.r')&&!t2.closest('a,button,input,select,label')){
const nm=t2.closest('.r').querySelector('.uc a,.uc span');
if(nm){S.info=(nm.textContent||'').trim()==='Deleted account'?(nm.dataset.u||''):(nm.textContent||'').trim();if(S.info)render()}}
return}
e.preventDefault();const a=b.dataset.a,p=cp();
if(a==='tab'){S.tab=b.dataset.t;S.n=200;S.sel.clear();lastI=null;if(S.tab!=='fb'&&/^y/.test(S.sort))S.sort='az';
if(S.tab==='nofb'||S.tab==='fb'||S.tab==='fans'||S.tab==='pend')S.cks.scope=S.tab}
else if(a==='info'){S.info=b.dataset.u;S.up=false;S.set=false}
else if(a==='up'){S.up=true;S.set=false;S.info=null;upFiles=[]}
else if(a==='set'){S.set=!S.set;S.up=false;S.info=null;S.cfm='';if(S.set)storageInfo().then(render)}
else if(a==='close'){S.up=false;S.set=false;S.info=null;S.cfm=''}
else if(a==='csv')return csvSave();
else if(a==='rstgo')return doRestore();
else if(a==='rstno'){S.rst=null}
else if(a==='bkup')return saveFile('unfollowers-backup-'+new Date().toISOString().slice(0,10)+'.json',backup()).then(ok=>{if(ok){try{localStorage.setItem('ig_bk',String(Date.now()))}catch(e){}render()}});
else if(a==='bklater'){try{localStorage.setItem('ig_bklater',String(Date.now()))}catch(e){}}
else if(a==='dsnap'){const sel=$('#sd');if(sel)S.snapSel=+sel.value;
if(S.cfm!=='snap'){S.cfm='snap'}else{S.cfm='';delSnap(p,S.snapSel);S.snapSel=-1}}
else if(a==='dhist'){if(S.cfm!=='hist'){S.cfm='hist'}else{S.cfm='';p.log=[];S.snap=-1;EC.k='';sv(p.name,true);say('History cleared')}}
else if(a==='dmarks'){if(S.cfm!=='marks'){S.cfm='marks'}else{S.cfm='';const old=Object.keys(p.meta).filter(u=>st(p.meta[u])).map(u=>[u,st(p.meta[u])]);
setStatus(p,old.map(x=>x[0]),'');say('All marks cleared',()=>{['k','r'].forEach(v=>setStatus(p,old.filter(x=>x[1]===v).map(x=>x[0]),v));render()})}}
else if(a==='dprof'){if(S.cfm!=='prof'){S.cfm='prof'}else{S.cfm='';return delProfile(p.name).then(render)}}
else if(a==='undo'){const f=undoFn;undoFn=null;clearTimeout(mt);$('#msg').hidden=true;if(f)f()}
else if(a==='go')return doImport();
else if(a==='more')S.n+=200;
else if(a==='lf')S.fo=!S.fo;
else if(a==='fclr'){S.f=FRESH();S.n=200}
else if(a==='unf'){const k=b.dataset.k;S.f[k]=S.f[k].filter(x=>x!==b.dataset.v);S.n=200}
else if(a==='kclr'){S.cks=Object.assign(FRESH(),{scope:S.cks.scope,sort:'shuffle',st:['u'],fo:S.cks.fo});return ckRebuild()}
else if(a==='latest'){S.snap=-1;S.sel.clear()}
else if(a==='hall'){const vis=p.log.slice(S.snap+1),all=vis.every(g=>S.hid[ck(g)]);vis.forEach(g=>S.hid[ck(g)]=!all)}
else if(a==='mk'||a==='mr'){const u=b.dataset.u,cur=st(p.meta[u]||{}),v=a==='mk'?'k':'r';setStatus(p,[u],cur===v?'':v)}
else if(a==='bk'||a==='br'||a==='bu'){const vis=new Set(view()),us=[...S.sel].filter(u=>vis.has(u)),was=us.map(u=>[u,st(p.meta[u]||{})]);
if(!us.length){S.sel.clear();render();return}
setStatus(p,us,a==='bk'?'k':a==='br'?'r':'');S.sel.clear();
say(us.length+' account'+(us.length>1?'s':'')+' '+(a==='bk'?'kept':a==='br'?'removed':'cleared'),()=>{was.forEach(x=>setStatus(p,[x[0]],x[1]));render()})}
else if(a==='bn')S.sel.clear();
else if(a==='check')return ckOpen();
else if(a==='ck')return ckAct(b.dataset.k);
else if(a==='ckf'){S.cks.fo=!S.cks.fo;return ckRender()}
else if(a==='ckagain')return ckRebuild();
else if(a==='ckclose'){S.ck=null;ckRender();return render()}
render()});

document.addEventListener('change',e=>{const t=e.target,p=cp(),d=t.dataset||{};
if(d.f!==undefined){const k=d.f,v=t.value;S.f[k]=t.checked?S.f[k].concat([v]):S.f[k].filter(x=>x!==v);S.n=200}
else if(d.ck!==undefined){const k=d.ck,v=t.value;S.cks[k]=t.checked?S.cks[k].concat([v]):S.cks[k].filter(x=>x!==v);return ckRebuild()}
else if(d.ck2!==undefined){S.cks[d.ck2]=t.value;if(d.ck2==='scope'){S.tab=t.value;S.sel.clear()}return ckRebuild()}
else if(d.ins!==undefined)S.ins[d.ins]=t.value;
else if(d.insd!==undefined)S.ins[d.insd+'d']=t.value;
else if(d.sort!==undefined)S.sort=t.value;
else if(d.csort!==undefined)S.csort=t.value;
else if(d.p!==undefined){S.cur=t.value;S.snap=-1;S.tab='nofb';S.sel.clear();EC.k=''}
else if(d.sn!==undefined){S.snap=+t.value;S.sel.clear();EC.k=''}
else if(d.all!==undefined){const v=view();if(t.checked)v.forEach(u=>S.sel.add(u));else v.forEach(u=>S.sel.delete(u))}
else if(d.sel!==undefined){const v=view(),i=+d.i;
if(shiftOn&&lastI!==null){const a=Math.min(lastI,i),b2=Math.max(lastI,i);for(let j=a;j<=b2;j++)if(v[j])t.checked?S.sel.add(v[j]):S.sel.delete(v[j])}
else t.checked?S.sel.add(d.sel):S.sel.delete(d.sel);
lastI=i;shiftOn=false}
else if(t.id==='rs'){const f=(t.files||[])[0];t.value='';if(f)restore(f);return}
else if(t.id==='sd'){S.snapSel=+t.value;S.cfm='';return render()}
else if(t.id==='pf'){const n=$('#nw');if(n)n.hidden=t.value!=='__new';if(t.value==='__new'&&$('#un'))$('#un').focus();return}
else if(t.id==='fl'){pickFiles([...t.files]);return}
else return;
render()});

document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'&&d.dataset.k!==undefined)S.hid[d.dataset.k]=!d.open},true);
document.addEventListener('keydown',e=>{
if(S.ck&&!(e.target.matches&&e.target.matches('input,select,textarea'))){
const k={ArrowRight:'skip',ArrowLeft:'back',k:'k',K:'k',x:'r',X:'r'}[e.key];
if(k){e.preventDefault();return ckAct(k)}
if(e.key==='Escape'){S.ck=null;ckRender();return render()}return}
if((S.rst||S.up||S.set||S.info)&&e.key==='Escape'){S.rst=null;S.up=false;S.set=false;S.info=null;S.cfm='';render()}
if(e.key==='/'&&!S.up&&!S.ck&&!(e.target.matches&&e.target.matches('input,select,textarea'))){e.preventDefault();const q=$('#q');if(q&&!q.hidden)q.focus()}});
document.addEventListener('dragover',e=>{if(!S.up)return;e.preventDefault();const z=$('#dz');if(z)z.classList.add('ov')});
document.addEventListener('dragleave',e=>{const z=$('#dz');if(z&&e.target===z)z.classList.remove('ov')});
document.addEventListener('drop',e=>{if(!S.up)return;e.preventDefault();const z=$('#dz');if(z)z.classList.remove('ov');
const fs2=[...(e.dataTransfer?e.dataTransfer.files:[])];if(fs2.length)pickFiles(fs2)});
$('#q').addEventListener('input',()=>{S.n=200;render()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){S.rst=null;S.up=false;S.set=false;S.info=null;S.cfm='';render()}});

render();
(async()=>{await storageInfo();try{if(window.claude){const r=await Promise.all([claude.use('user'),claude.use('db')]);if(r[0]&&r[1])coll=r[1].collection('data/users/'+await r[0].id())}}catch(e){}load()})();
</script></body></html>
